services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      # Empty means demo mode. Set it in the shell or in a .env file to use the model.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - tasks-data:/data

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  tasks-data:
